<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220"><title>Filas Orlando</title>
<link rel="manifest" href="./manifest.json"><link rel="stylesheet" href="./styles.css">
</head><body>
<main class="app">
<header><div><p class="eyebrow">ORLANDO LIVE</p><h1>Filas prioritárias</h1></div><button id="backBtn" class="ghost hidden">Parques</button></header>
<section id="home"><p class="muted">Escolha um parque</p><div id="parkGrid" class="park-grid"></div></section>
<section id="parkView" class="hidden">
<div class="title-row"><div><h2 id="parkName"></h2><p id="updatedAt" class="muted">Ainda não atualizado</p></div><button id="refreshBtn" class="primary">Atualizar filas</button></div>
<div id="errorBox" class="error hidden"></div><div id="staleBox" class="warning hidden"></div>
<div id="rides" class="rides"></div>
<label class="field"><span>Última atração realizada (opcional)</span><select id="lastRide"><option value="">Nenhuma</option></select></label>
<div class="toggles">
<button data-state="fome">Fome</button><button data-state="cansados">Cansados</button>
<button data-state="chuva">Chuva</button><button data-state="não queremos molhar">Não queremos molhar</button>
</div>
<button id="copyBtn" class="copy">Copiar para ChatGPT</button><textarea id="preview" readonly></textarea>
</section>
<footer>Powered by <a href="https://www.themeparks.wiki/" target="_blank" rel="noopener">ThemeParks.wiki</a></footer>
</main><div id="toast" class="toast hidden">Copiado!</div><script src="./app.js" type="module"></script>
</body></html>
